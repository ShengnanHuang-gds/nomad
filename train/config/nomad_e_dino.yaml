project_name: nomad
run_name: nomad_e_dino

# E-μσ: append [x, y, sigma] from frozen DINO dir + B distance + kappa.
# vision_encoder and dist_pred_net stay at B Epoch 29; only the UNet trains.
goal_pos_dim: 3
goal_mask_prob: 0.5

use_wandb: False
train: True
batch_size: 64
epochs: 30
gpu_ids: [0]
num_workers: 4
lr: 1e-4
optimizer: adamw
clipping: False
max_norm: 1.
scheduler: "cosine"
warmup: True
warmup_epochs: 4
seed: 0

model_type: nomad
vision_encoder: nomad_vint
encoding_size: 256
obs_encoder: efficientnet-b0
attn_unet: False
cond_predict_scale: False
mha_num_attention_heads: 4
mha_num_attention_layers: 4
mha_ff_dim_factor: 4
down_dims: [64, 128, 256]

num_diffusion_iters: 10
normalize: True
context_type: temporal
context_size: 3
alpha: 1e-4

distance:
  min_dist_cat: 0
  max_dist_cat: 40
action:
  min_dist_cat: 3
  max_dist_cat: 40

len_traj_pred: 8
learn_angle: False

image_size: [96, 96]
datasets:
  go_stanford:
    data_folder: C:/Users/61078/Desktop/nomad/go_stanford
    train: vint_train/data/data_splits/go_stanford/train/
    test: vint_train/data/data_splits/go_stanford/test/
    end_slack: 0
    goals_per_obs: 2
    negative_mining: True

print_log_freq: 100
image_log_freq: 0
num_images_log: 0
eval_fraction: 0.25
wandb_log_freq: 10
eval_freq: 1
