name: Inspect DXF layers and entities
on:
  push:
    branches: [cad-export/first-floor-dxf]
    paths: ['.github/workflows/first-floor-dxf.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch CAD file
        run: |
          git init -q
          git remote add origin https://github.com/ShengnanHuang-gds/nomad.git
          git sparse-checkout init --cone
          git sparse-checkout set cad_data/建筑/建筑
          git fetch --depth=1 --filter=blob:none origin refs/heads/cad-export/first-floor-dxf
          git checkout -q -B inspect FETCH_HEAD
      - name: Summarize DXF
        run: |
          python -m pip install --quiet ezdxf
          python - <<'PY'
          from collections import Counter, defaultdict
          import ezdxf
          p = 'cad_data/建筑/建筑/JZ-1F_t3.dxf'
          doc = ezdxf.readfile(p)
          msp = doc.modelspace()
          print('INSUNITS=', doc.header.get('$INSUNITS'))
          print('HEADER_EXTMIN=', doc.header.get('$EXTMIN'))
          print('HEADER_EXTMAX=', doc.header.get('$EXTMAX'))
          print('MODELSPACE_ENTITY_COUNT=', len(msp))
          types = Counter()
          by_layer = defaultdict(Counter)
          for e in msp:
              typ = e.dxftype()
              try:
                  layer = e.dxf.layer
              except Exception:
                  layer = '(no layer)'
              types[typ] += 1
              by_layer[layer][typ] += 1
          print('ENTITY_TYPES=', dict(types.most_common()))
          print('LAYERS_USED_BEGIN')
          for layer, counts in sorted(by_layer.items(), key=lambda item: (-sum(item[1].values()), item[0])):
              print(f'{layer}\t{sum(counts.values())}\t{dict(counts.most_common())}')
          print('LAYERS_USED_END')
          print('INSERT_BLOCK_COUNTS=', dict(Counter(e.dxf.name for e in msp.query('INSERT')).most_common(50)))
          print('LAYER_TABLE_BEGIN')
          for layer in doc.layers:
              used = sum(by_layer[layer.dxf.name].values())
              if used:
                  print(f'{layer.dxf.name}\tcolor={layer.dxf.color}\tlinetype={layer.dxf.linetype}\tused={used}')
          print('LAYER_TABLE_END')
          PY
