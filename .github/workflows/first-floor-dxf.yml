name: Classify DXF entities
on:
  push:
    branches: [cad-export/first-floor-dxf]
    paths: ['.github/workflows/first-floor-dxf.yml']
permissions:
  contents: write
jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch CAD files
        run: |
          git init -q
          git remote add origin https://github.com/ShengnanHuang-gds/nomad.git
          git sparse-checkout init --cone
          git sparse-checkout set cad_data/建筑/建筑
          git fetch --depth=1 --filter=blob:none origin refs/heads/cad-export/first-floor-dxf
          git checkout -q -B work FETCH_HEAD
      - name: Classify each drawing entity
        run: |
          python -m pip install --quiet ezdxf
          python - <<'PY'
          import csv, json
          from collections import Counter, defaultdict
          from pathlib import Path
          import ezdxf

          root = Path('cad_data/建筑/建筑')
          source = root / 'JZ-1F_t3.dxf'
          output = root / 'JZ-1F_t3_entity_classification.csv'
          summary = root / 'JZ-1F_t3_entity_classification_summary.txt'
          doc = ezdxf.readfile(source)

          annotation_layers = {'PUB_DIM', 'DIM_ELEV', 'DIM_LEAD', 'DIM_IDEN', 'DIM_SYMB'}
          wall_layers = {'WALL', 'CURTWALL', 'A-Wall'}
          window_layers = {'WINDOW', 'A-Window'}
          text_types = {'TEXT', 'MTEXT', 'ATTRIB', 'ATTDEF'}

          def classify(space, entity):
              typ = entity.dxftype()
              layer = entity.dxf.get('layer', '0')
              if typ == 'DIMENSION' or layer in annotation_layers:
                  return ('dimension_annotation', 'high', 'DIMENSION type or known dimension layer')
              if typ in text_types or layer in {'PUB_TEXT', 'SPACE', 'AXIS_TEXT'}:
                  return ('text_annotation', 'high', 'text entity type or known text layer')
              if space != 'Model':
                  return ('layout_frame_or_titleblock', 'high', 'entity is in paper-space layout')
              if layer in wall_layers:
                  confidence = 'medium' if typ in {'LINE', 'ARC', 'LWPOLYLINE', 'POLYLINE'} else 'low'
                  return ('wall_candidate', confidence, 'matched wall layer; arcs may include door swings')
              if layer in window_layers:
                  return ('window_candidate', 'medium', 'matched window layer')
              if layer == 'STAIR':
                  return ('stair_candidate', 'medium', 'matched stair layer')
              if layer == 'EVTR':
                  return ('elevator_candidate', 'medium', 'matched elevator layer')
              if layer == 'AXIS':
                  return ('axis_reference', 'medium', 'matched axis layer; reference only, not 3D geometry')
              if layer.startswith('$TD_AUDIT_GENERATED_'):
                  return ('conversion_generated_review', 'low', 'converter-generated layer; inspect before use')
              if typ in {'OLE2FRAME', 'WIPEOUT'}:
                  return ('embedded_or_masking_object_review', 'low', 'embedded or masking object')
              return ('unknown_review', 'low', 'no confident layer/type rule matched')

          def geometry(entity):
              typ = entity.dxftype()
              dxf = entity.dxf
              data = {}
              for key in ('start', 'end', 'center', 'insert', 'location', 'defpoint'):
                  try:
                      if dxf.hasattr(key):
                          v = dxf.get(key)
                          data[key] = [round(float(x), 4) for x in v]
                  except Exception:
                      pass
              for key in ('radius', 'start_angle', 'end_angle', 'height', 'rotation', 'xscale', 'yscale', 'zscale'):
                  try:
                      if dxf.hasattr(key):
                          data[key] = round(float(dxf.get(key)), 4)
                  except Exception:
                      pass
              if typ == 'LWPOLYLINE':
                  try:
                      data['vertices_xy_bulge'] = [[round(float(x),4), round(float(y),4), round(float(b),6)] for x,y,b in entity.get_points('xyb')]
                      data['closed'] = bool(entity.closed)
                  except Exception:
                      pass
              if typ == 'INSERT':
                  try:
                      data['block_name'] = dxf.name
                  except Exception:
                      pass
              if typ in {'TEXT', 'MTEXT', 'ATTRIB', 'ATTDEF'}:
                  try:
                      data['text'] = entity.text if typ == 'MTEXT' else dxf.text
                  except Exception:
                      pass
              if typ == 'DIMENSION':
                  try:
                      data['measured_value'] = round(float(entity.get_measurement()), 4)
                  except Exception:
                      pass
              return json.dumps(data, ensure_ascii=False, separators=(',', ':'))

          spaces = [('Model', doc.modelspace())]
          for layout in doc.layouts:
              if layout.name.lower() != 'model':
                  spaces.append((layout.name, layout))

          fields = ['id','space','entity_type','layer','category','confidence','rule','block_name','geometry_json']
          counts = Counter()
          layer_counts = defaultdict(Counter)
          total = 0
          with output.open('w', newline='', encoding='utf-8-sig') as f:
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              for space_name, space in spaces:
                  for entity in space:
                      typ = entity.dxftype()
                      layer = entity.dxf.get('layer', '0')
                      category, confidence, rule = classify(space_name, entity)
                      block_name = entity.dxf.get('name', '') if typ == 'INSERT' else ''
                      writer.writerow({
                          'id': entity.dxf.get('handle', ''),
                          'space': space_name,
                          'entity_type': typ,
                          'layer': layer,
                          'category': category,
                          'confidence': confidence,
                          'rule': rule,
                          'block_name': block_name,
                          'geometry_json': geometry(entity),
                      })
                      total += 1
                      counts[category] += 1
                      layer_counts[layer][category] += 1

          with summary.open('w', encoding='utf-8') as f:
              f.write(f'Source: {source}\nTotal classified entities (model + paper layouts): {total}\n')
              f.write(f'Drawing units header ($INSUNITS): {doc.header.get("$INSUNITS")}\n\n')
              f.write('Counts by category:\n')
              for category, n in counts.most_common():
                  f.write(f'  {category}: {n}\n')
              f.write('\nCounts by layer and category:\n')
              for layer, cats in sorted(layer_counts.items(), key=lambda item: (-sum(item[1].values()), item[0])):
                  f.write(f'  {layer}: {dict(cats)}\n')
          print('CSV=', output, 'bytes=', output.stat().st_size)
          print('SUMMARY=', summary, 'bytes=', summary.stat().st_size)
          print('TOTAL=', total)
          print('CATEGORY_COUNTS=', dict(counts))
          print('MODELSPACE_COUNT=', len(doc.modelspace()))
          PY
      - name: Commit classification files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name github-actions
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- 'cad_data/建筑/建筑/JZ-1F_t3_entity_classification.csv' 'cad_data/建筑/建筑/JZ-1F_t3_entity_classification_summary.txt'
          git commit -m 'Add classified DXF entity inventory'
          git push origin HEAD:refs/heads/cad-export/first-floor-dxf
