name: Convert facade drawings for first-floor comparison
on:
  push:
    branches: [cad-export/first-floor-dxf]
    paths: ['.github/workflows/first-floor-dxf.yml']
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch facade drawing
        run: |
          git init -q
          git remote add origin https://github.com/ShengnanHuang-gds/nomad.git
          git sparse-checkout init --cone
          git sparse-checkout set cad_data/幕墙/幕墙 cad_data/建筑/建筑
          git fetch --depth=1 --filter=blob:none origin refs/heads/cad-export/first-floor-dxf
          git checkout -q -B export FETCH_HEAD
      - name: Convert and audit with ODA File Converter
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libopengl0 libxcb-util1 libegl1 xvfb
          mkdir -p "$RUNNER_TEMP/oda-out"
          curl -fL 'https://www.opendesign.com/guestfiles/get?filename=ODAFileConverter_QT6_lnxX64_11dll.AppImage' -o "$RUNNER_TEMP/ODAFileConverter.AppImage"
          chmod +x "$RUNNER_TEMP/ODAFileConverter.AppImage"
          "$RUNNER_TEMP/ODAFileConverter.AppImage" --appimage-extract >/dev/null
          xvfb-run -a "$PWD/squashfs-root/AppRun" "$GITHUB_WORKSPACE/cad_data/幕墙/幕墙" "$RUNNER_TEMP/oda-out" ACAD2018 DXF 0 1 '3诺丁汉平立面.dwg'
          test -s "$RUNNER_TEMP/oda-out/3诺丁汉平立面.dxf"
          cp "$RUNNER_TEMP/oda-out/3诺丁汉平立面.dxf" "$GITHUB_WORKSPACE/cad_data/幕墙/幕墙/3诺丁汉平立面.dxf"
          python -m pip install --quiet ezdxf
          python - <<'PY'
          from collections import Counter
          import json
          import ezdxf
          p = 'cad_data/幕墙/幕墙/3诺丁汉平立面.dxf'
          doc = ezdxf.readfile(p)
          auditor = doc.audit()
          msp = doc.modelspace()
          print(f'entities={len(msp)}, audit_errors={len(auditor.errors)}, audit_fixes={len(auditor.fixes)}')
          print('FACADE_LAYOUTS', [(l.name, len(l)) for l in doc.layouts])
          print('FACADE_LAYERS', Counter(e.dxf.get('layer', '0') for e in msp).most_common(35))
          arcs = [e for e in msp if e.dxftype() == 'ARC' and 90000 < e.dxf.radius < 140000]
          print('FACADE_ARCS', json.dumps([[e.dxf.handle, e.dxf.layer, list(e.dxf.center), e.dxf.radius, e.dxf.start_angle, e.dxf.end_angle] for e in arcs[:120]], ensure_ascii=False))
          print('FACADE_BLOCKS', Counter(e.dxf.name for e in msp if e.dxftype() == 'INSERT').most_common(25))
          from pathlib import Path
          entries = []
          for label, source in [('facade', doc), ('architecture', ezdxf.readfile('cad_data/建筑/建筑/JZ-1F_t3.dxf'))]:
              for e in source.modelspace():
                  t = e.dxftype()
                  l = e.dxf.get('layer', '0')
                  row = [label, e.dxf.handle, l, t]
                  if t == 'ARC' and e.dxf.radius > 2000:
                      row += [list(e.dxf.center), e.dxf.radius, e.dxf.start_angle, e.dxf.end_angle]
                  elif t in ('TEXT', 'MTEXT'):
                      row += [list(e.dxf.insert), e.dxf.text]
                  elif t == 'INSERT' and ('AXIS' in (l + e.dxf.name).upper() or e.attribs):
                      row += [list(e.dxf.insert), e.dxf.name, [[at.dxf.tag, at.dxf.text] for at in e.attribs]]
                  elif t == 'LINE' and 'AXIS' in l.upper():
                      row += [list(e.dxf.start), list(e.dxf.end)]
                  else:
                      continue
                  entries.append(row)
          Path('cad_data/幕墙/幕墙/facade_alignment_inventory.json').write_text(json.dumps(entries, ensure_ascii=False), encoding='utf-8')
          if auditor.errors:
              raise SystemExit('DXF audit reported errors')
          if len(msp) < 1:
              raise SystemExit('DXF entity count unexpectedly low')
          PY
      - name: Commit generated DXF
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name github-actions
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- 'cad_data/幕墙/幕墙/facade_alignment_inventory.json'
          git commit -m 'Record facade and architectural alignment coordinates'
          git push origin HEAD:refs/heads/cad-export/first-floor-dxf
