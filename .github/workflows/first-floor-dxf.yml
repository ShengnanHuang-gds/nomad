name: Create cleaned DXF review copy
on:
  push:
    branches: [cad-export/first-floor-dxf]
    paths: ['.github/workflows/first-floor-dxf.yml']
permissions:
  contents: write
jobs:
  create-review:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch CAD files
        run: |
          git init -q
          git remote add origin https://github.com/ShengnanHuang-gds/nomad.git
          git sparse-checkout init --cone
          git sparse-checkout set cad_data/建筑/建筑
          git fetch --depth=1 --filter=blob:none origin refs/heads/cad-export/first-floor-dxf
          git checkout -q -B work FETCH_HEAD
      - name: Generate review copy
        run: |
          python -m pip install --quiet ezdxf
          python - <<'PY'
          from pathlib import Path
          import ezdxf
          src = Path('cad_data/建筑/建筑/JZ-1F_t3.dxf')
          dst = src.with_name('JZ-1F_t3_review.dxf')
          doc = ezdxf.readfile(src)
          msp = doc.modelspace()
          # Hide obvious annotation-only layers in this review copy.
          hidden = {'PUB_DIM', 'PUB_TEXT', 'DIM_ELEV', 'DIM_LEAD', 'DIM_IDEN', 'DIM_SYMB', 'SPACE', 'AXIS_TEXT'}
          turned_off = []
          for layer in doc.layers:
              if layer.dxf.name in hidden:
                  layer.dxf.color = -abs(layer.dxf.color or 7)
                  turned_off.append(layer.dxf.name)
          # Dimensions are mixed into the AXIS layer too; remove only dimension
          # objects from this disposable copy while keeping the axis geometry.
          dimensions = list(msp.query('DIMENSION'))
          for entity in dimensions:
              msp.delete_entity(entity)
          doc.saveas(dst)
          check = ezdxf.readfile(dst)
          auditor = check.audit()
          print('CREATED=', dst)
          print('HIDDEN_LAYERS=', sorted(turned_off))
          print('REMOVED_DIMENSION_ENTITIES=', len(dimensions))
          print('REVIEW_MODELSPACE_ENTITIES=', len(check.modelspace()))
          print('AUDIT_ERRORS=', len(auditor.errors))
          if auditor.errors:
              raise SystemExit('Review DXF audit failed')
          PY
      - name: Commit review copy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name github-actions
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- 'cad_data/建筑/建筑/JZ-1F_t3_review.dxf'
          git commit -m 'Add cleaned DXF review copy'
          git push origin HEAD:refs/heads/cad-export/first-floor-dxf
