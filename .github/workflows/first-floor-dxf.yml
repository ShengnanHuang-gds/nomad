name: Create strict building-layer DXF
on:
  push:
    branches: [cad-export/first-floor-dxf]
    paths: ['.github/workflows/first-floor-dxf.yml']
permissions:
  contents: write
jobs:
  create-building-view:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch CAD files
        run: |
          git init -q
          git remote add origin https://github.com/ShengnanHuang-gds/nomad.git
          git sparse-checkout init --cone
          git sparse-checkout set cad_data/建筑/建筑
          git fetch --depth=1 --filter=blob:none origin refs/heads/cad-export/first-floor-dxf
          git checkout -q -B work FETCH_HEAD
      - name: Keep only building and axis layers
        run: |
          python -m pip install --quiet ezdxf
          python - <<'PY'
          from pathlib import Path
          import ezdxf
          src = Path('cad_data/建筑/建筑/JZ-1F_t3.dxf')
          dst = src.with_name('JZ-1F_t3_building_layers.dxf')
          keep = {'WALL', 'CURTWALL', 'WINDOW', 'STAIR', 'EVTR', 'AXIS', 'A-Wall', 'A-Window'}
          doc = ezdxf.readfile(src)
          msp = doc.modelspace()
          removed = 0
          for entity in list(msp):
              layer = entity.dxf.layer
              kind = entity.dxftype()
              if layer not in keep or kind == 'DIMENSION' or (layer == 'AXIS' and kind in {'TEXT', 'MTEXT'}):
                  msp.delete_entity(entity)
                  removed += 1
          for layer in doc.layers:
              if layer.dxf.name not in keep:
                  layer.dxf.color = -abs(layer.dxf.color or 7)
          doc.saveas(dst)
          check = ezdxf.readfile(dst)
          audit = check.audit()
          print('OUTPUT=', dst)
          print('KEPT_LAYERS=', sorted(keep))
          print('REMOVED_MODELSPACE_ENTITIES=', removed)
          print('REMAINING_ENTITIES=', len(check.modelspace()))
          print('AUDIT_ERRORS=', len(audit.errors))
          print('REMAINING_LAYER_COUNTS=')
          for name in sorted(keep):
              n = sum(1 for e in check.modelspace() if e.dxf.layer == name)
              print(f'{name}: {n}')
          if audit.errors:
              raise SystemExit('Filtered DXF audit failed')
          PY
      - name: Commit filtered copy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name github-actions
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- 'cad_data/建筑/建筑/JZ-1F_t3_building_layers.dxf'
          git commit -m 'Add strict building layer DXF view'
          git push origin HEAD:refs/heads/cad-export/first-floor-dxf
