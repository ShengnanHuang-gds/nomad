name: Locate named building in DXF
on:
  push:
    branches: [cad-export/first-floor-dxf]
    paths: ['.github/workflows/first-floor-dxf.yml']
permissions:
  contents: read
jobs:
  search-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch CAD file
        run: |
          git init -q
          git remote add origin https://github.com/ShengnanHuang-gds/nomad.git
          git sparse-checkout init --cone
          git sparse-checkout set cad_data/建筑/建筑
          git fetch --depth=1 --filter=blob:none origin refs/heads/cad-export/first-floor-dxf
          git checkout -q -B inspect FETCH_HEAD
      - name: Search text labels
        run: |
          python -m pip install --quiet ezdxf
          python - <<'PY'
          import ezdxf
          from ezdxf.entities import DXFEntity
          doc = ezdxf.readfile('cad_data/建筑/建筑/JZ-1F_t3.dxf')
          def text_and_xy(e):
              typ = e.dxftype()
              if typ == 'TEXT':
                  s = e.dxf.text
                  p = e.dxf.insert
              elif typ == 'MTEXT':
                  s = e.text
                  p = e.dxf.insert
              elif typ in {'ATTRIB', 'ATTDEF'}:
                  s = e.dxf.text
                  p = e.dxf.insert
              else:
                  return None
              return str(s).replace('\n', ' '), (round(p.x, 1), round(p.y, 1)), e.dxf.layer
          print('TEXT_LABELS_BEGIN')
          for space in [doc.modelspace(), *doc.blocks]:
              for e in space:
                  out = text_and_xy(e)
                  if out:
                      s, p, layer = out
                      print(f'{layer}\t{p}\t{s[:160]}')
          print('TEXT_LABELS_END')
          PY
