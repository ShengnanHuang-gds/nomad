name: Create classification overlay DXF
on:
  push:
    branches: [cad-export/first-floor-dxf]
    paths: ['.github/workflows/first-floor-dxf.yml']
permissions:
  contents: write
jobs:
  overlay:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch CAD source
        run: |
          git init -q
          git remote add origin https://github.com/ShengnanHuang-gds/nomad.git
          git sparse-checkout init --cone
          git sparse-checkout set cad_data/建筑/建筑
          git fetch --depth=1 --filter=blob:none origin refs/heads/cad-export/first-floor-dxf
          git checkout -q -B work FETCH_HEAD
      - name: Build color-coded diagnostic copy
        run: |
          python -m pip install --quiet ezdxf
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import ezdxf

          root = Path('cad_data/建筑/建筑')
          src = root / 'JZ-1F_t3.dxf'
          dst = root / 'JZ-1F_t3_classification_overlay.dxf'
          doc = ezdxf.readfile(src)
          msp = doc.modelspace()
          annotation_layers = {'PUB_DIM','DIM_ELEV','DIM_LEAD','DIM_IDEN','DIM_SYMB','PUB_TEXT','SPACE','AXIS_TEXT'}
          text_types = {'TEXT','MTEXT','ATTRIB','ATTDEF'}
          wall_layers = {'WALL','CURTWALL','A-Wall'}
          window_layers = {'WINDOW','A-Window'}
          kept = Counter()
          removed = Counter()

          for entity in list(msp):
              layer = entity.dxf.get('layer','0')
              typ = entity.dxftype()
              if typ == 'DIMENSION' or typ in text_types or layer in annotation_layers:
                  msp.delete_entity(entity)
                  removed[typ] += 1
                  continue
              if layer in wall_layers:
                  color, category = 1, 'wall candidate (red)'
              elif layer in window_layers:
                  color, category = 4, 'window candidate (cyan)'
              elif layer == 'STAIR':
                  color, category = 6, 'stair candidate (magenta)'
              elif layer == 'EVTR':
                  color, category = 3, 'elevator candidate (green)'
              elif layer == 'AXIS':
                  color, category = 8, 'axis reference (gray)'
              elif layer.startswith('$TD_AUDIT_GENERATED_'):
                  color, category = 30, 'converter-generated review (orange)'
              else:
                  color, category = 2, 'unknown review (yellow)'
              try:
                  entity.dxf.color = color
              except Exception:
                  pass
              kept[category] += 1

          # Remove paper-space title blocks and drawing borders only from this copy.
          layout_removed = 0
          for layout in doc.layouts:
              if layout.name.lower() == 'model':
                  continue
              for entity in list(layout):
                  layout.delete_entity(entity)
                  layout_removed += 1

          doc.saveas(dst)
          check = ezdxf.readfile(dst)
          auditor = check.audit()
          print('OUTPUT=', dst)
          print('MODELSPACE_ENTITIES=', len(check.modelspace()))
          print('PAPERSPACE_ENTITIES_REMOVED=', layout_removed)
          print('REMOVED_ANNOTATION_COUNTS=', dict(removed))
          print('VISIBLE_CATEGORY_COUNTS=', dict(kept))
          print('AUDIT_ERRORS=', len(auditor.errors))
          if auditor.errors:
              raise SystemExit('Overlay DXF audit failed')
          PY
      - name: Commit overlay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name github-actions
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- 'cad_data/建筑/建筑/JZ-1F_t3_classification_overlay.dxf'
          git commit -m 'Add color-coded entity classification overlay'
          git push origin HEAD:refs/heads/cad-export/first-floor-dxf
